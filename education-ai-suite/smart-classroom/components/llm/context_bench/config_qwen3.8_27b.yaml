#
# Qwen3.8-27B long-context benchmark: one config for both questions.
#
#   speed + resources   always measured -- TTFT, TPOT, throughput, RAM/GPU peak and mean
#   accuracy            add --accuracy to also score RULER retrieval and generation fidelity
#
# Both land in ONE report.txt, printed to the console at the end of the run.
#
#   .\components\llm\context_bench\run_benchmark.ps1 --config components/llm/context_bench/config_qwen3.8_27b.yaml
#   ... --accuracy                       # + the accuracy suites below
#   ... --accuracy --list-profiles       # probe count and run matrix, loads nothing
#   ... --accuracy --profiles paged_min mtp_k3    # narrow a 6-profile sweep
#
# The measured variable here is MULTI-TOKEN PREDICTION: a no-MTP baseline plus a
# num_assistant_tokens sweep, every profile otherwise identical. MTP is self-speculative
# decoding -- the model's own draft head proposes k tokens and the main model verifies them
# in one pass -- so expect TPOT to move and TTFT not to.
#
# With --accuracy this is the run that answers "does raising k cost correctness". It is also
# the expensive one: 6 profiles x 32 probes. Use --profiles to cut it down while iterating.
#
# Needs the nightly OpenVINO stack -- see requirements-qwen3.8.txt.

model:
  provider: openvino
  device: GPU
  weight_format: int8
  models_base_path: "models"
  model_dirs:
    Qwen3.8-27B: models/openvino/Qwen3.8-27B-int8-ov

benchmark:
  models: [Qwen3.8-27B]
  context_tokens: [8000]
  # Throughput decode length. Accuracy probes use the per-suite budgets under `accuracy`.
  output_tokens: 64
  warmup: 1
  iterations: 3
  timeout_sec: 5400
  max_system_memory_pct: 100
  gpu_memory_budget_gb: 59
  cache_dir: null
  output_dir: monitoring/executionlogs/context_bench/qwen3.8_27b

# Only read when --accuracy is passed. Delete the section to make that flag an error.
accuracy:
  suites: [retrieval, generation]
  # The no-MTP row every MTP profile is reported against.
  baseline_profile: paged_min
  seed: 20260917
  # who_what_benchmark's embedding model, for the `Similarity` column only. WWB is OPTIONAL --
  # without it that one column reports `--` and everything else is computed natively:
  #   pip install "whowhatbench @ git+https://github.com/openvinotoolkit/openvino.genai.git#subdirectory=tools/who_what_benchmark"
  # Set to null to switch the semantic column off deliberately.
  embedding_model: sentence-transformers/all-mpnet-base-v2

  retrieval:
    # RULER's three behaviours, which fail independently: retrieval (niah_*), multi-hop
    # tracing (vt), aggregation (cwe/fwe). `qa` asks in natural language.
    tasks: [niah_single, niah_multikey, niah_multivalue, niah_multiquery, vt, cwe, fwe, qa]
    # Fraction of the transcript the fact is planted at; 0.0 is the very top and hardest.
    # Applies to niah_single / niah_multikey / qa only -- the rest spread by construction.
    depths: [0.0, 0.5, 1.0]
    # 2 is an indication, not a rate (0%, 50% or 100%). Raise once a profile looks suspect.
    samples: 2
    output_tokens: 64
    options:
      niah_multikey: {num_distractors: 3}
      niah_multivalue: {num_values: 4}
      niah_multiquery: {num_queries: 4}
      vt: {chain_length: 3, num_chains: 3}
      cwe: {num_target_words: 10}
      fwe: {top_k: 3}

  generation:
    # The real classroom task, scored against the baseline profile's answer to the same
    # prompt. `fact_sheet` also carries its own ground truth (the Coverage column).
    tasks: [summary, fact_sheet]
    depths: [0.5]
    samples: 2
    output_tokens: 256
    options:
      fact_sheet: {num_facts: 6}

# MTP only runs on the paged backend, so every profile keeps the same scheduler and PA
# backend and differs only in `num_assistant_tokens`. `cache_size: 4` is a measured floor:
# speculative decoding builds a second continuous-batching pipeline for the draft model and
# genai sizes both from this one number, so 3 had every MTP profile dropped before prefill.
profiles:
  - name: paged_min
    ov: &ov_qwen38
      ATTENTION_BACKEND: PA
      GPU_ENABLE_LARGE_ALLOCATIONS: "YES"
      KV_CACHE_PRECISION: f16
    scheduler: &scheduler_qwen38
      max_num_batched_tokens: 32768
      max_num_seqs: 1
      enable_prefix_caching: false
      cache_size: 4

  - name: mtp_k1
    ov: *ov_qwen38
    scheduler: *scheduler_qwen38
    mtp: {num_assistant_tokens: 1}

  - name: mtp_k2
    ov: *ov_qwen38
    scheduler: *scheduler_qwen38
    mtp: {num_assistant_tokens: 2}

  - name: mtp_k3
    ov: *ov_qwen38
    scheduler: *scheduler_qwen38
    mtp: {num_assistant_tokens: 3}

  - name: mtp_k4
    ov: *ov_qwen38
    scheduler: *scheduler_qwen38
    mtp: {num_assistant_tokens: 4}

  - name: mtp_k6
    ov: *ov_qwen38
    scheduler: *scheduler_qwen38
    mtp: {num_assistant_tokens: 6}
