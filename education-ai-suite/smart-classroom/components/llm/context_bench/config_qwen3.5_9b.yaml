#
# PTL 64 GB / 59 GB shared-GPU configuration for Qwen3.5-9B int8 at 160K.
# One profile: the current candidate, to be measured by this benchmark.

model:
  provider: openvino
  device: GPU
  weight_format: int8
  models_base_path: "models"

benchmark:
  models: [Qwen/Qwen3.5-9B]
  context_tokens: [160000]
  output_tokens: 64
  warmup: 0
  iterations: 1
  # Seconds without ANY progress event from the child, not a wall-clock cap on the case.
  # The longest silent interval is one prefill, so this is effectively a TTFT ceiling:
  # historical 160K TTFTs here were 237-350s. A cold warm-up iteration also pays first-run
  # kernel compilation, so raise this if a warm-up is reported as `timeout`.
  timeout_sec: 600
  # Host and GPU use the same physical memory on PTL. Do not reject a completed
  # case on host-RAM percentage; the 59 GB GPU budget is reported independently.
  max_system_memory_pct: 100
  gpu_memory_budget_gb: 59
  cache_dir: null
  output_dir: monitoring/executionlogs/context_bench/qwen3.5_9b

# Settings whose rationale is fixed by the benchmark's design, not by tuning:
# - max_num_seqs=1: this benchmark is one 160K request, not a concurrency test.
# - dynamic_split_fuse=true: keeps prefill/decode scheduling fused.
# - enable_prefix_caching=false: prevents warmup prompt reuse from faking TTFT.
# - cache_size omitted: OpenVINO manages the KV pool. Historical runs used a fixed pool
#   (cache_size=7/8 covered the 4.93 GiB f16 KV; 16 reached 34.2 GB peak GPU and 24 was
#   rejected as larger than available memory), so those numbers do not carry over.
#
# KV precision and prefill chunk size are the candidate values under test. f16 KV has
# historical support -- it beat u8 on TTFT by ~32% on this model -- while
# max_num_batched_tokens=16000 is BELOW the 32768 that historically looked saturated
# (4096 -> 16384 -> 32768 improved total time ~3.4% then ~8.0% cumulative; 65536 was
# slower). That earlier sweep was single-shot per point, which is exactly what this tool's
# warm-up + median iterations exist to re-check. See docs/dev-guide/context-bench/.
profiles:
  - name: optimized
    ov:
      GPU_ENABLE_LARGE_ALLOCATIONS: "YES"
      KV_CACHE_PRECISION: f16
    scheduler:
      max_num_seqs: 1
      max_num_batched_tokens: 16000
      dynamic_split_fuse: true
      enable_prefix_caching: false
