#
# PTL 64 GB / 59 GB shared-GPU configuration for Qwen3.8-27B int4 at 8K.
#
# Unlike config_qwen3.5_9b.yaml and config_qwen3.6_35b_a3b.yaml, the measured variable here
# is NOT stateful-vs-paged. It is multi-token prediction: this model ships its own MTP draft
# head (openvino_mtp_model.xml), openvino_genai can run it as self-speculative decoding, and
# it is by far the largest decode-side lever available on this model. The matrix is therefore
# one no-MTP paged baseline plus a sweep of `num_assistant_tokens`.
#
# There is no `stateful` profile in this file, and that is a constraint rather than an
# omission: on a non-NPU device openvino_genai only runs speculative decoding on the paged
# attention backend, so a stateful profile could not carry MTP and would not be comparable
# with the rows that do.
#
# HISTORY: this file previously declared every case BLOCKED, crashing during model load with
# `crashed:exitcode=3221225477:0xC0000005 STATUS_ACCESS_VIOLATION` on any device and at any
# context length, attributed to VLMPipeline having no reader for the `qwen3_5` architecture.
# That is no longer true. On openvino 2026.5.0 / openvino-genai 2026.5.0.0-3416 with the
# published OpenVINO/Qwen3.8-27B-int4-ov IR, the model loads in ~50 s and generates normally,
# with and without MTP.
#
# Measured on this box with the shipped 8K classroom prompt and 64 output tokens, reusing
# one loaded pipeline so load/compile noise cannot move the knee:
#
#   profile        TPOT ms   accepted
#   mtp_k1         197.2     63.2%
#   mtp_k2         156.8     61.8%   <- recommended balanced profile
#   mtp_k3         150.9     50.7%   <- minimum-TPOT profile
#   mtp_k4         152.0     41.3%
#   mtp_k6         161.3     30.2%
#
# k=6 does not have a hidden acceptance knob: this GenAI MTP path requires a static candidate
# count and a zero confidence threshold. Lower k to raise acceptance; on this workload k=3
# also improves TPOT. MTP shortens decode and does not touch prefill.

model:
  provider: openvino
  device: GPU
  weight_format: int4
  models_base_path: "models"
  # The published IR is named `Qwen3.8-27B-int4-ov`, which is not the
  # `<name>_<weight_format>` layout `models_base_path` derives. Named explicitly rather than
  # renamed on disk, so re-downloading the model does not silently break this config.
  model_dirs:
    Qwen3.8-27B: models/openvino/Qwen3.8-27B-int4-ov

benchmark:
  models: [Qwen3.8-27B]
  context_tokens: [1000]
  output_tokens: 64
  # A k-sweep compares six profiles against each other, so a single sample per profile is not
  # enough: the run-to-run spread that motivated iterations in the first place is the same
  # size as the differences between adjacent k values. One warm-up absorbs kernel compilation,
  # three measured iterations give a median with visible min/max.
  warmup: 1
  iterations: 3
  timeout_sec: 1800
  max_system_memory_pct: 100
  gpu_memory_budget_gb: 59
  cache_dir: null
  output_dir: monitoring/executionlogs/context_bench/qwen3.8_27b

# All six profiles carry an IDENTICAL `ov` and `scheduler` block. The only variable in this
# file is the `mtp` section, so every TPOT difference between rows is attributable to
# multi-token prediction and nothing else.
#
# `ATTENTION_BACKEND: PA` is mandatory for the MTP rows, not tuning: genai refuses
# speculative decoding on the SDPA backend for anything but a Gemma4 MTP pair. It is set on
# the baseline too so the baseline is the same pipeline as what it is being compared against.
#
# `max_num_batched_tokens: 32768` also bounds one MTP step, which submits
# `num_assistant_tokens + 1` tokens -- far below this, but the tool checks it, so lowering
# this value below k+1 is rejected before loading rather than confusing the scheduler.
profiles:
  # The row every speedup below is measured against: same pipeline, same pool, draft head
  # not loaded. Its `tok/step` should read exactly 1.00 -- if it does not, MTP is leaking
  # into the baseline and none of the comparisons mean anything.
  - name: paged_min
    ov: &ov_qwen38
      ATTENTION_BACKEND: PA
      GPU_ENABLE_LARGE_ALLOCATIONS: "YES"
      KV_CACHE_PRECISION: f16
    scheduler: &scheduler_qwen38
      max_num_batched_tokens: 32768
      # NOT a concurrency setting on this model: Qwen3.8-27B is hybrid (16 full_attention +
      # 48 linear_attention layers, per config.json's layer_types), and the paged backend
      # reserves one whole linear-attention state per schedulable sequence out of the same
      # `cache_size` pool the KV blocks come from.
      max_num_seqs: 1
      # Mandatory, not tuning: iterations reuse one prompt, so a warm prefix cache would
      # report a TTFT no first request ever sees.
      enable_prefix_caching: false
      # Fixed for this 8K A/B matrix so baseline and MTP use the same scheduler pool.
      # 4 GB is the measured minimum that admits the target + draft pipelines; using
      # `auto` here would resolve to 2 GB for baseline and 4 GB for MTP, changing two
      # variables in what should be a one-variable comparison.
      cache_size: 4

  # The sweep. k is the number of candidates the draft head offers per verification pass;
  # higher k means fewer main-model passes but a lower share of candidates accepted, and the
  # product of those two is what this sweep exists to locate. 1, 2, 3, 4, 6 brackets the knee
  # measured at short context (k=3) with a point on either side of it.
  - name: mtp_k1
    ov: *ov_qwen38
    scheduler: *scheduler_qwen38
    mtp:
      num_assistant_tokens: 1

  - name: mtp_k2
    # Recommended balanced profile: ~62% acceptance with TPOT close to k=3.
    ov: *ov_qwen38
    scheduler: *scheduler_qwen38
    mtp:
      num_assistant_tokens: 2

  - name: mtp_k3
    # Minimum-TPOT profile: slightly faster than k=2, but only ~51% acceptance.
    ov: *ov_qwen38
    scheduler: *scheduler_qwen38
    mtp:
      num_assistant_tokens: 3

  - name: mtp_k4
    ov: *ov_qwen38
    scheduler: *scheduler_qwen38
    mtp:
      num_assistant_tokens: 4

  - name: mtp_k6
    ov: *ov_qwen38
    scheduler: *scheduler_qwen38
    mtp:
      num_assistant_tokens: 6
